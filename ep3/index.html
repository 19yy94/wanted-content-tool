<script>
(() => {
  const cv = document.getElementById('c');
  const cvb = document.getElementById('cb');
  const cvm = document.getElementById('cm');
  const ctxF = cv.getContext('2d'), ctxB = cvb.getContext('2d'), ctxM = cvm.getContext('2d');
  let ctx = ctxF;
  const blur = document.querySelector('#goo feGaussianBlur');
  const $ = id => document.getElementById(id);
  // 1편 규칙: 배경 #2297FE, 꺼진 점 = 배경 + 흰색 22% / 40% / 58%, 켜진 점 = 흰색
  const BG = [0x14,0x19,0x1E];   // 다크: 원티드 블랙
  const HI = [0x00,0xAD,0xFF];   // 켜진 데이터 = 스카이블루
  const OFF = [[36,46,56],[46,58,70],[58,72,86]];   // 꺼진 데이터 = 원티드 블랙 계열 그레이
  const col = (tone, t) => `rgb(${OFF[tone].map((v,i) => Math.round(v + (HI[i] - v)*t)).join(',')})`;
  // 줌 중에는 주인공 말고 나머지를 배경색 쪽으로 눌러줌
  const colD = (tone, t, d) => `rgb(${OFF[tone].map((v,i) => { const c = v + (HI[i] - v)*t; return Math.round(c + (BG[i] - c)*d); }).join(',')})`;

  let W, H, DPR;
  // 캔버스는 항상 1080×1350(인스타 4:5)으로 그리고, 화면에는 비율 그대로 축소해서 보여줌
  let SC = 1;   // 캔버스 해상도 배율 (내보내기 해상도용). 좌표는 항상 1080×1350 기준
  function setScale(sc){
    SC = sc;
    for (const c of [cv, cvb, cvm]){ c.width = Math.round(W*sc); c.height = Math.round(H*sc); }
    glowLayer();
  }
  function resize(){
    W = 1080; H = 1350; DPR = 1;
    for (const [c,x] of [[cv,ctxF],[cvb,ctxB],[cvm,ctxM]]){ c.width = W; c.height = H; x.setTransform(1,0,0,1,0,0); }
  }

  // seeded random so 패턴이 매번 같게
  let seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;

  // --- 구 데이터: 위도별 가로줄, 각 줄은 원/캡슐 시퀀스 ---
  const MAXLAT = 80 * Math.PI/180;
  const THICK = 0.62;        // 줄 두께 / 줄 간격
  const GAP = 1.2;           // 요소 사이 간격 (원 지름 단위)
  let PGAP = 1.0;            // 페어(원+캡슐) 붙기 전 간격 — 슬라이더
  let rings = [], U = 0, rowGap = 0, REP = 1;   // REP: 구 무늬를 경도 방향으로 몇 번 반복할지 (짧은 루프용)
  function build(){
    seed = 7;
    rings = [];
    const n = +$('rows').value;
    PGAP = +$('pgap').value;
    rowGap = Math.PI / n;                 // 극에서 극까지 꽉 채움 (구멍 없이)
    U = rowGap*THICK;                     // 원 지름 (구 표면 길이) — 어디서나 같은 크기
    for (let i=0;i<n;i++){
      const phi = -Math.PI/2 + rowGap*(i+0.5);
      const cosp = Math.cos(phi);
      const total = 2*Math.PI*cosp / U / REP;   // 이 줄(한 구간)에 들어갈 원 개수
      const items = [];
      let u = 0;
      while (u < total - (1 + GAP)*0.999){
        const r = rnd(), tone = Math.floor(rnd()*3);
        const cl = 1.6 + Math.pow(rnd(),1.4)*4.6;
        if (r < 0.55 && u + 1 + PGAP + cl + GAP <= total){
          items.push({t:'pair', tone, cl, len:1+PGAP+cl, merge:rnd(), offR:rnd()-0.5});
          u += 1 + PGAP + cl + GAP;
        } else if (r >= 0.8 && u + cl + GAP <= total){ items.push({t:'cap', tone, len:cl}); u += cl + GAP; }
        else { items.push({t:'dot', tone, len:1}); u += 1 + GAP; }
      }
      if (!items.length) continue;
      const extra = (total - u) / items.length;
      const k = U / cosp;                 // 표면 길이 → 경도 각도
      let a = rnd()*Math.PI*2;
      for (const it of items){ it.a0 = a; a += (it.len + GAP + extra)*k; }
      // 같은 구간을 REP번 이어 붙임 → 2π/REP만 돌아도 처음 모습과 똑같아짐
      const all = [];
      for (let j=0;j<REP;j++) for (const it of items) all.push({...it, a0: it.a0 + j*2*Math.PI/REP});
      rings.push({phi, cosp, k, items: all});
    }
  }

  const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
  const smooth = t => t*t*(3-2*t);
  const backOut = t => { const s=1.6; t-=1; return t*t*((s+1)*t+s)+1; };
  const wrap = a => { a = (a+Math.PI) % (2*Math.PI); if (a<0) a+=2*Math.PI; return a-Math.PI; };

  // --- 3D: 위에서 살짝 내려다봐서 가로줄이 곡선(위도선)으로 보이게 ---
  let TILT = 0, cT = 1, sT = 0, CX, CY, RR, SIDE = 1;   // SIDE: 1 앞면, -1 뒷면
  function P(th, ph, out){
    const x = Math.cos(ph)*Math.sin(th), y = Math.sin(ph), z = Math.cos(ph)*Math.cos(th);
    let y2 = y*cT - z*sT, z2 = (y*sT + z*cT)*SIDE, x2 = x;
    if (z2 < 0){ const l = Math.hypot(x2,y2)||1; x2/=l; y2/=l; } // 반대편은 실루엣에 붙임
    out.x = CX + RR*x2; out.y = CY - RR*y2; out.z = z2;
    return out;
  }
  const pt = {x:0,y:0,z:0};
  const facing = (th, ph) => P(th, ph, pt).z;

  // 위도 ph 위에서 경도 t1→t2 구간을 따라 휘어진 캡슐(양 끝 둥근) 그리기
  // r: 두께 절반(구 표면 길이, R=1 기준), 각 끝을 cutL/cutR(표면 길이)만큼 깎음
  function shapePts(ph, t1, t2, r, cutL, cutR, NF, CF){
    const cp = Math.cos(ph);
    let s0 = t1*cp + cutL, s1 = t2*cp - cutR;          // 위도선 따라 표면 길이 좌표
    if (s1 - s0 < 0.002) return null;
    if (s1 - s0 < 2*r) r = (s1 - s0)/2;                 // 너무 짧으면 원으로
    const a = s0 + r, b = s1 - r;
    const zc = facing((a+b)/2/cp, ph);
    if (zc < -0.15) return null;

    // 뒤집기: 앞면(키워드) → 옆으로 섰다가(폭 0) → 뒷면(질문). 뒷면이 보이기 시작하면서 길어짐
    const FLIP = S.ph === 'exp', fp = FLIP ? ease(u) : 0;
    const FSX = FLIP ? Math.abs(Math.cos(Math.PI*fp)) : 1;
    const ex = {exp: fp < 0.5 ? 0.05*smooth(fp/0.5) : lerp(0.05, 1, ease((fp-0.5)/0.5)), hold:1, pan:1 - ease(clamp(u/0.55,0,1)), zout:1 - ease(clamp(u/0.6,0,1))}[S.ph] ?? 0;   // 줌아웃 앞 절반 동안 말풍선 → 원+캡슐

    // 줌 변환
    // 카메라: 주인공 쪽으로 이동 + 확대 + 캡슐 방향에 맞춰 회전 (줌 끝에는 캡슐이 수평)
    let Zc = 1, hb = null, Z = 1, MA = 1, MB = 0, MC_ = 0, MD = 1, ME = 0, MF = 0;
    let hbN = null;
    const geo = b => { const dcx0 = (b.dx1 + b.dx2)/2, ccx0 = (b.cx1 + b.cx2)/2, span = Math.hypot(b.cx2 - b.dx1, b.cy - b.dy);
      return {ang: Math.atan2(b.cy - b.dy, ccx0 - dcx0), hx: (b.dx1 + b.cx2)/2, hy: (b.dy + b.cy)/2, Z: Math.min(+$('zsize').value / b.h, (W*0.8)/span)}; };
    if (S.hero && ez > 0){
      hb = heroBox(S.hero, S.ring);
      let {ang, hx, hy, Z: z0} = geo(hb);
      if (PAN && S.next){
        hbN = heroBox(S.next, S.nring);
        const g2 = geo(hbN);
        ang = lerp(ang, g2.ang, pe); hx = lerp(hx, g2.hx, pe); hy = lerp(hy, g2.hy, pe); z0 = lerp(z0, g2.Z, pe);

    RESF = clamp(Zc*SC, 1, 10);
    for (const x of [ctxF, ctxB, ctxM]){ x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,W*SC,H*SC); x.setTransform(MA*SC,MB*SC,MC_*SC,MD*SC,ME*SC,MF*SC); }

    // goo 크기를 원 크기에 맞춤 (줄 수가 많아도 간격이 뭉개지지 않게)
    const dDisp = U*RR*Zc*(EXP.on ? SC : cv.clientWidth/W);
    const std = +$('gooAmt').value * dDisp / 30;

    const dim = 0.55*ez + 0.15*ex;   // (pan 중에도 ex로 자연스럽게)
    const WAIST = clamp(0.3 + +$('gooAmt').value*0.08, 0.3, 0.92);   // 목 두께 = 끈적임 슬라이더   // 질문이 떠 있을 땐 주변도 조금 더 눌러서 흰 박스 대비 ↑
    const punch = +$('punch').value;
    // 오버슈트 있는 이징: 끝에서 살짝 더 파고들었다가 돌아옴 (punch로 세기 조절)
    const snap = t => { if (t <= 0) return 0; if (t >= 1) return 1;
      const k = 2.8*punch, q = t - 1; return q*q*((k+1)*q + k) + 1; };
    const zone = +$('zone').value, ratio = +$('ratio').value, spread = +$('spread').value;
    const backA = +$('back').value;
    cvb.style.opacity = backA;

    // --- 질문 레이아웃 (화면 좌표). 주인공 원+캡슐이 이 모양으로 '변형'됨 (겹치거나 바꿔치기 없음) ---
    // --- 질문 레이아웃 (화면 좌표). 주인공 원+캡슐이 이 모양으로 '변형'됨 (겹치거나 바꿔치기 없음) ---
    let HERO_M = 1;
    function makeLY(hb, qi, exL, fl){
      const Q = QS[qi];
      const d0 = Zc*hb.h;
      const dL = mapP([hb.dx1, hb.dy]), dR = mapP([hb.dx2, hb.dy]), cL = mapP([hb.cx1, hb.cy]), cR = mapP([hb.cx2, hb.cy]);
      const dot0 = {x: (dL[0]+dR[0])/2 - d0/2, y: (dL[1]+dR[1])/2 - d0/2, d: d0};
      const cw = Math.hypot(cR[0]-cL[0], cR[1]-cL[1]);
      const cap0 = {x: (cL[0]+cR[0])/2 - cw/2, y: (cL[1]+cR[1])/2 - Zc*hb.ch/2, w: cw, h: Zc*hb.ch};
      // 뒤집힌 뒷면(포지션 원 + 질문)은 '질문 크기'만큼 키움
      const qsc = +$('qsize').value;
      const d = Z*hb.h*qsc, g0 = Math.max(0, Z*(hb.cx1 - hb.dx2))*qsc, M0 = 110;   // 화면 좌우 최소 여백 (질문이 길면 글자를 줄여서 이 안에 맞춤)
      const capWmax = W - 2*M0 - d - g0, padX = 0.42*d*(+$('qpad').value), padY = 0.34*d*(+$('qpad').value);   // 말풍선 안 여백
      // 글자 크기: 원 지름에 비례, 지정한 줄바꿈이 그대로 들어가도록 넘치면 살짝 줄임
      let fq = clamp(d*(+$('qfont').value), 24, 90);   // 질문 글자 = 원 지름 × 비율
      const longest = Math.max(...Q.q.split('\n').map(l => textW(l, fq, 650)));
      if (longest > capWmax - 2*padX) fq *= (capWmax - 2*padX)/longest;
      const lh = fq*1.38;
      mctx.font = `600 ${fq}px ${FONT}`;
      const lines = [];
      for (const para of Q.q.split('\n')){
        let cur = '';
        for (const w of para.split(' ')){ const t = cur ? cur + ' ' + w : w; if (textW(t, fq, 650) > capWmax - 2*padX && cur){ lines.push(cur); cur = w; } else cur = t; }
        if (cur) lines.push(cur);
      }
      // 말풍선 폭 = 가장 긴 글줄 + 좌우 여백 (글자에 딱 맞게), 전체는 가운데 정렬
      const tW = Math.max(...lines.map(l => textW(l, fq, 650)));
      const capWf = Math.min(capWmax, tW + 2*padX), M = (W - (d + g0 + capWf))/2;
      const hq = lines.length*lh;
      const capHf = Math.max(d, hq + 2*padY), top = H/2 - capHf/2;
      const dotF = {x: M, y: top, d}, capF = {x: M + d + g0, y: top, w: capWf, h: capHf};
      const sag = +$('qcurve').value * 14 * Math.sin(TILT)/Math.sin(22*Math.PI/180);
      const kq = 4*sag / (capWf*capWf), xmF = capF.x + capF.w/2;
      const bendF = x => -kq*(x - xmF)*(x - xmF);
      const dcxF = dotF.x + d/2, dcyF = dotF.y + d/2 + bendF(dcxF);
      const capPtsF = boxPts(capF.x, capF.x + capF.w, capF.y, capF.y + capF.h, d/2, bendF, MN, MC);
      const dotPtsF = boxPts(dcxF - d/2, dcxF + d/2, dcyF - d/2, dcyF + d/2, d/2, () => 0, MN, MC);
      const neckF = neckFlat(dcxF, capF.x + d/2, dotF.y + d/2, d/2, WAIST, bendF);
      // 줌인하는 동안 구 위의 휜 모양을 곧은 원+캡슐로 서서히 펴줌 → 키워드가 휘었다 펴지는 느낌 없음

    }

    const ovPh = S.hero && ((S.ph === 'zin') || ['kw','exp','hold','pan','zout'].includes(S.ph));
    if (ovPh && hb){

      if (PAN && hbN){ HERO_M = 0; LYN = makeLY(hbN, S.qi, 0, smooth(clamp((u-0.45)/0.5, 0, 1))); HL.set(S.next, LYN); }
    }

    const sides = backA > 0 ? [-1, 1] : [1];
    for (const side of sides){
    SIDE = side; ctx = side > 0 ? ctxF : ctxB;
    for (const ring of rings){
      const {phi, k: K} = ring;
      const r0 = U/2;

      for (const it of ring.items){
        const aP = it.a0 + rot, a = aP + CAM;   // aP: 붙는 상태 계산용(카메라와 무관), a: 그리기용

        const kk = shrinkAt(a + it.len*K/2, phi), cut = r0*(1-kk), inner = cut*Math.max(0,1-m);
        const rr = r0*kk*(1 + 0.16*punch*pulse);
        if (L && side < 0) continue;   // 뒷면 레이어에 주인공이 희미하게 겹쳐 보이지 않게
        if (L && side > 0){
          // 원래 자리 모양(구 위 곡면) → 질문 말풍선으로 점 단위 모핑

            }
            const moS = (H0, Z0, F0) => H0.map((p,i) => { const q = mapP(p), z = Z0[i], f = F0[i];
              const x = lerp(q[0], z[0], L.fl), y = lerp(q[1], z[1], L.fl);   // 휜 모양 → 곧은 모양
              return [lerp(x, f[0], L.ex), lerp(y, f[1], L.ex)]; });                  // → 질문 말풍선
            // 뒤집기 축(뱃지 가운데 세로선) 기준으로 가로만 접힘 — 글자 경로용 모양은 펼친 상태로 따로 보관

            ctx.fillStyle = colD(it.tone, wf, 0);

          }
        }

        shape(phi, cA, cE, rr, inner, cut);

    } // sides

    const LT = PAN ? (u < 0.5 ? LY : LYN) : LY;
    const ovt = $('ovt');
    ovt.style.opacity = LT ? 1 : 0;
    if (LT){
      const ex = LT.ex, LY = LT;
      const frozen = S.ph === 'zout' || (PAN && u < 0.5);
      const {Q, dot0, cap0, dotF, capF, d, capWf, padX, fq, lh, lines, hq, kq} = LY;
      const D = {x: lerp(dot0.x, dotF.x, ex), y: lerp(dot0.y, dotF.y, ex), d: lerp(dot0.d, dotF.d, ex)};
      const C = {x: lerp(cap0.x, capF.x, ex), y: lerp(cap0.y, capF.y, ex), w: lerp(cap0.w, capF.w, ex), h: lerp(cap0.h, capF.h, ex)};

      const ctr = pts => { let x=0,y=0; pts.forEach(p => { x+=p[0]; y+=p[1]; }); return [x/pts.length, y/pts.length]; };
      const hdc = LY.hd ? ctr(LY.hd) : [D.x + D.d/2, D.y + D.d/2], hcc = LY.hc ? ctr(LY.hc) : [C.x + C.w/2, C.y + C.h/2];
      const xm = C.x + C.w/2;
      const bend = x => -kq*ex*(x - xm)*(x - xm);

      const arc = (xa, xb, y) => { const xc = (xa+xb)/2, ya = y + bend(xa), yb2 = y + bend(xb), yc = y + bend(xc);
        return `M${xa.toFixed(1)} ${ya.toFixed(1)} Q${xc.toFixed(1)} ${(2*yc - (ya+yb2)/2).toFixed(1)} ${xb.toFixed(1)} ${yb2.toFixed(1)}`; };
      const kwY = lerp(hcc[1], C.y + C.h/2, ex), kwX = lerp(hcc[0], C.x + C.w/2, ex);

      if (frozen){ /* 줌아웃·이동 시작: 글자는 직전 모양 그대로 두고 빠르게 사라짐 (따라 휘며 떨리지 않게) */ }
      else if (LY.capM){
        // 모핑 중인 캡슐의 윗변/아랫변 사이를 보간해서 글줄 경로를 만듦 → 방향·곡률이 모양과 정확히 일치
        const cm = LY.capM, Tt = cm.slice(0, MN+1), Bt = cm.slice(MN+MC, MN+MC+MN+1).reverse();
        const at = (arr, t) => { const f = t*MN;

        const line = (v, t0, t1) => { let d = ''; for (let j=0;j<=30;j++){ const t = lerp(t0, t1, j/30), a = at(Tt, t), b = at(Bt, t);

        const radC = Math.min(lerp(cap0.h/2, d/2, ex), C.h/2), inner = Math.max(1, C.w - 2*radC);
        const t0 = (padX - radC)/inner;
        defs = `<path id="pkw" d="${line(0.5, -radC/inner, 1 + radC/inner)}"/>`;
        lines.forEach((ln, i) => { defs += `<path id="pq${i}" d="${line(clamp((ty0 - C.y + lh*(i + 0.5))/C.h, 0, 1), t0, 1.6)}"/>`; });
        // 질문은 말풍선 모양 안에서만 보이게 → 뒤집히며 길어질 때 글자가 같이 드러남
        defs += `<clipPath id="qclip"><path d="M${cm.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}Z"/></clipPath>`;

  function overlaySVG(){
    const ovt = $('ovt');
    return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="${Math.round(1080*SC)}" height="${Math.round(1350*SC)}">
      <style>@font-face{font-family:'Wanted Sans Variable';src:url(data:${WS_MIME};base64,${WS_SUB}) format('${WS_FMT}');font-weight:1 999}text{font-weight:600;letter-spacing:-.025em;fill:#14191E;text-rendering:geometricPrecision}#tdot{font-weight:800;fill:#FFFFFF;letter-spacing:-.02em}</style>
      <g>${ovt.innerHTML}</g></svg>`;
  }
  const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });


  const withTO = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]);
  const toConsole = (blob, name, vid) => { try { if (document.documentElement.classList.contains('embed') && parent.__offerSave){ parent.__offerSave(blob, name, vid ? 'vid' : 'img'); return true; } } catch(e){} return false; };
  // 프레임 인코딩을 못 하는 브라우저(아이폰 등): 화면 재생을 그대로 실시간 녹화
  async function recRealtime(){
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const type = window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t));
    if (!type){ em('이 브라우저는 영상 저장을 지원하지 않아요. PC 크롬에서 열어 주세요.'); return; }
    const btn = $('bExp'); btn.disabled = true; EXP.on = false;
    const E = document.createElement('canvas'); E.width = W; E.height = H; const ex = E.getContext('2d');
    const GOO = window.NOGOO ? 'none' : 'url(#goo)', backA = +$('back').value;
    const L = Math.min(60, Math.max(4, plan().L || 10));
    const chunks = [], rec = new MediaRecorder(E.captureStream(30), {mimeType: type, videoBitsPerSecond: 16e6});
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    resetSim(); let busy = false, done = false; const t0 = performance.now();
    const draw = async () => {
      if (busy) return; busy = true;
      try {
        ex.setTransform(1,0,0,1,0,0); ex.filter = 'none'; ex.globalAlpha = 1; ex.fillStyle = '#14191E'; ex.fillRect(0,0,W,H);
        ex.drawImage(cvg, 0, 0); ex.filter = GOO;
        if (backA > 0){ ex.globalAlpha = backA; ex.drawImage(cvb, 0, 0); ex.globalAlpha = 1; }
        ex.drawImage(cv, 0, 0); ex.drawImage(cvm, 0, 0); ex.filter = 'none'; ex.drawImage(cvt, 0, 0);
        if (+$('ovt').style.opacity > 0){ const u = URL.createObjectURL(new Blob([overlaySVG()], {type:'image/svg+xml'})); try { ex.drawImage(await loadImg(u), 0, 0, W, H); } finally { URL.revokeObjectURL(u); } }
      } catch(e){} busy = false; };
    await draw(); rec.start(250);
    await new Promise(res => { const loop = () => { const t = (performance.now() - t0)/1000; em(`녹화 중… ${Math.min(100, Math.round(t/L*100))}%`);
      if (t >= L){ res(); return; } draw(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
    await new Promise(r => { rec.onstop = r; try { rec.requestData(); } catch(e){} rec.stop(); setTimeout(r, 2500); });
    const blob = new Blob(chunks, {type: type.split(';')[0]}), name = `wanted-ep3-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    em(`완료 · ${(blob.size/1048576).toFixed(1)}MB`);
    if (!toConsole(blob, name, true)) showPv(blob, true, name);
    btn.disabled = false;
  }
  $('bExp').onclick = async () => {
    if (EXP.on) return;
    if (!('VideoEncoder' in window) || !window.Mp4Muxer){ return recRealtime(); }
    const sc = +$('res').value, EW = Math.round(W*sc), EH = Math.round(H*sc);
    const E = document.createElement('canvas'); E.width = EW; E.height = EH;
    const eo = E.getContext('2d'); eo.imageSmoothingQuality = 'high';
    // 1080 영상은 2배로 그린 뒤 줄여서 저장 → 끈적한 테두리·글자 가장자리가 매끈해짐
    const SS = sc < 1.5 ? 2 : 1, B = document.createElement('canvas'); B.width = EW*SS; B.height = EH*SS;
    const ex = B.getContext('2d'), BW = B.width, BH = B.height;
    const GOO = window.NOGOO ? 'none' : 'url(#goo)';
    const fps = 30, k = +$('qn').value, zoomOn = $('zoomOn').checked;
    const L = plan().L, N = Math.round(L*fps), dt = L/N;
    const btn = $('bExp'); btn.disabled = true;
    setScale(sc*SS);
    EXP.on = true; EXP.k = zoomOn ? k : QS.length; EXP.miss = false;
    try {
      // 1) 속도 보정: 한 루프에 정확히 2π 회전하도록 두 번 맞춤
      const pl = plan();
      EXP.speed = pl.v; EXP.spin = pl.spin;
      const target = 2*Math.PI/(pl.rep || 1)*pl.turns;
      if (pl.preview){ em('준비 중…'); resetSim(); }   // 프리뷰와 똑같이: 처음 상태에서 바로 녹화
      else {
      // 질문 사이 이동·줌인으로 도는 양(pr)은 고정이라, 실제로 재본 다음 목표 회전량을 정하고 구가 보이는 동안의 속도만 맞춤
      const tgt = 2*Math.PI/(pl.rep || 1)*pl.turns;
      for (let pass=0; pass<4; pass++){
        em(`준비 중… (${pass+1})`); resetSim();
        const d = await runLoop(N, dt);
        if (EXP.miss){ em('질문 고를 페어를 못 찾은 구간이 있어요. 줌 간격이나 줄 수를 바꿔 보세요.'); throw 0; }
        const pr = EXP.panRot || 0;   // 줌인·이동으로 도는 양(고정)은 빼고 속도만 보정
        if (Math.abs(d - tgt) < 1e-6) break;
        EXP.speed *= Math.max(0.01, tgt - pr) / Math.max(0.01, d - pr);
      }
      // 2) 한 바퀴 미리 돌려서 상태를 안정시킨 뒤, 두 번째 바퀴를 녹화
      em('준비 중… (마무리)'); resetSim(); await runLoop(N, dt);
      }
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: {codec:'avc', width:EW, height:EH}, fastStart:'in-memory' });
      let encErr = null;
      const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => encErr = e });
      let cfg = {codec:'avc1.640028', width:EW, height:EH, bitrate:Math.min(36e6, 16e6*sc*sc), framerate:fps};
      for (const c of (EW*EH > 2228224 ? ['avc1.640033','avc1.640034','avc1.4d0033'] : ['avc1.640028','avc1.4d0028'])){
        cfg.codec = c; if ((await VideoEncoder.isConfigSupported(cfg)).supported) break; }
      enc.configure(cfg);
      const backA = +$('back').value;
      await runLoop(N, dt, async i => {
        ex.setTransform(1,0,0,1,0,0); ex.filter = 'none'; ex.globalAlpha = 1;
        ex.fillStyle = '#14191E'; ex.fillRect(0,0,BW,BH);
        ex.drawImage(cvg, 0, 0);
        ex.filter = GOO;
        if (backA > 0){ ex.globalAlpha = backA; ex.drawImage(cvb, 0, 0); ex.globalAlpha = 1; }
        ex.drawImage(cv, 0, 0);
        ex.drawImage(cvm, 0, 0);
        ex.filter = 'none';
        ex.drawImage(cvt, 0, 0);
        if (+$('ovt').style.opacity > 0){
          const url = URL.createObjectURL(new Blob([overlaySVG()], {type:'image/svg+xml'}));
          try { ex.drawImage(await loadImg(url), 0, 0, BW, BH); } finally { URL.revokeObjectURL(url); }
        }
        eo.drawImage(B, 0, 0, EW, EH);
        const vf = new VideoFrame(E, {timestamp: Math.round(i*1e6/fps), duration: Math.round(1e6/fps)});
        enc.encode(vf, {keyFrame: i % (fps*2) === 0}); vf.close();
        if (encErr) throw encErr;
        while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));
        if (i % 10 === 0){ em(`녹화 중… ${Math.round(i/N*100)}%`); await tick(); }
      });
      await enc.flush(); muxer.finalize();
      const blob = new Blob([muxer.target.buffer], {type:'video/mp4'});
      const name = `wanted-ep3-loop-${EW}x${EH}-${k}q-${Math.round(L)}s.mp4`;
      em(`완료 · ${(blob.size/1048576).toFixed(1)}MB`);
      if (!toConsole(blob, name, true)) showPv(blob, true, name);
    } catch(e){ if (e) em('실패: ' + (e.message || e)); }
    finally { EXP.on = false; btn.disabled = false; setScale(1); resetSim(); last = performance.now(); }
  };

{
