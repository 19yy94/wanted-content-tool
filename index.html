.qrow:first-child{border-top:0;padding-top:2px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:#70737C}
.qdel{border:0;background:none;font-size:12px;color:#A0A3AA;padding:2px 4px;cursor:pointer}.qdel:hover{color:hsl(var(--destructive))}
.qrow .input{height:40px}.qrow textarea.input{height:auto;min-height:64px;resize:none}
.sec h3.sub{font-size:14px;font-weight:700;color:#171719;margin:0}.sec h3.sub .cnt{font-weight:600;color:#A0A3AA;margin-left:4px}.sec .sep-h{margin:18px 0 16px}
/* 명함 만들기 화면 톤: 연한 블루 옵션 · 블루 라인 버튼 */
:root{--tint:228 75% 97.5%;--tint-h:228 75% 95%;--blue:220 92% 57%}
.tg{background:hsl(var(--tint));border:0;color:hsl(var(--blue));font-weight:600}
.tg:hover{background:hsl(var(--tint-h))}
.tg[aria-pressed=true]{background:hsl(var(--blue));color:#fff}
.tg.dashed{border:0;color:hsl(var(--blue))}
.btn.line{background:#fff;border:1px solid hsl(var(--blue));color:hsl(var(--blue))}.btn.line:hover{background:hsl(var(--tint))}
.btn.tint{background:hsl(var(--tint));color:hsl(var(--blue));border:0}.btn.tint:hover{background:hsl(var(--tint-h))}
.tag{background:hsl(var(--tint));color:hsl(var(--blue))}
.step{background:#F2F2F3}
.tags.flat{align-items:center}.kwadd{height:30px;width:30px;border-radius:9999px;padding:0}.tags .tg-edit{height:30px;border-radius:9999px;font-size:12px}
.toolbar{min-height:44px}

/* 버튼 정리 */
.btn.ai{background:none;padding:0 6px;height:30px}.btn.ai:hover{background:hsl(var(--tint))}

.tg.dashed{display:inline-grid;place-items:center;width:36px;padding:0}
.kwadd{display:inline-grid;place-items:center}
#fQAdd{gap:6px}
.cw{position:relative;display:inline-flex}
.cx{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;padding:0;background:#70737C;color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.12s;cursor:pointer}
.cx .i{width:11px;height:11px}
.cw:hover .cx,.cx:focus-visible{opacity:1;transform:none}
.cx:hover{background:#171719}
@media(hover:none){.cw .tg[aria-pressed=true]+.cx{opacity:1;transform:none}}
.qdel{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:#A0A3AA}.qdel .i{width:14px;height:14px}.qdel:hover{background:#F2F2F3;color:#171719}
.toolbar .btn.icon:not(#play){color:#70737C}
.tb-l{align-items:center;gap:8px}
.toolbar .btn.icon{width:40px;height:40px;border-radius:50%;padding:0;display:inline-grid;place-items:center}
.toolbar #play{background:#171719!important;color:#fff!important}.toolbar #play:hover{background:#2E2F33!important}
.toolbar #play.paused{background:#F2F2F3!important;color:#171719!important}.toolbar #play.paused:hover{background:#E9E9EB!important}
.toolbar .btn.icon .i{width:16px;height:16px}
.logo.wide{display:block;position:relative}
.logo.wide .sq{width:100%;height:auto;flex:1;min-height:84px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px Pretendard,sans-serif;color:#70737C}
.logo.wide .sq small{font-size:11px;font-weight:500;color:#A0A3AA}
.logo.wide .sq .i{width:18px;height:18px;margin-bottom:2px}
.logo.wide .sq.has{background:#fff}.logo.wide .sq img{height:72px;width:72px;object-fit:contain;border-radius:10px}
.logo.wide .lx{right:8px;top:8px}
.co{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:end}.co .field{margin-top:12px}
.co .logo .sq{width:44px;height:44px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 11px Pretendard,sans-serif;color:#8A8D94}
.co .logo .sq .i{width:18px;height:18px}
.co .logo .sq.has{background:#fff;padding:0;overflow:hidden;border:1px solid hsl(var(--border))}.co .logo .sq img{width:100%;height:100%;object-fit:cover;border-radius:0}

.brand{border:0;background:none;padding:0;height:28px;display:inline-flex;align-items:center;cursor:pointer;margin-right:2px}
.brand img{height:22px;width:auto;display:block}
.brand #brandPh{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px dashed #C9CBD0;border-radius:8px;font-size:11px;font-weight:600;color:#8A8D94}
.brand #brandPh .i{width:14px;height:14px}
.brand.has + input + b{padding-left:12px;border-left:1px solid hsl(var(--border))}
.pre{position:relative}.pre span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:#A0A3AA;pointer-events:none}.pre .input{padding-left:52px}
/* 코너 값 통일: 카드 16 · 입력/버튼 10 · 칩/작은 버튼 8 */
.wlogo{height:20px;width:auto;display:block}
.preview,.sec,.top{border-radius:16px}
.stagebox{border-radius:10px}
.input,.btn,.sel,.tags,.tgrp,.tg-edit,.logo .sq,.co .logo .sq,.logo.wide .sq,.btn.soft.sm{border-radius:10px}
.tgrp button{border-radius:7px}
.tg,.trig,.btn.sm,.btn.ai,.qdel{border-radius:8px}
.tag,.kwadd,.tags .tg-edit{border-radius:8px}
.toolbar .btn.icon{border-radius:50%}
.co .logo .sq .i{width:15px;height:15px}
@media(max-width:600px){
.page{padding:12px 12px 32px;gap:12px}
.appbar{padding:0 12px;gap:8px}.appbar b{font-size:14px;white-space:nowrap}.appbar .wlogo{height:16px}
#openImport{padding:0 10px;font-size:0;gap:0}#openImport .i{width:18px;height:18px}
.top{padding:8px}.tlist{width:100%;overflow-x:auto;scrollbar-width:none}.trig{flex:1 0 auto;padding:0 10px;font-size:13px}.step{display:none}
.preview{padding:12px;min-width:0}
.stagebox{width:100%!important;min-width:0!important;max-width:100%!important}
.exbar{grid-template-columns:1fr 1fr}.exbar .sel{grid-column:1/-1}
.exbar .btn{padding:0 10px;font-size:13px}
.side{height:auto!important;max-height:none!important;overflow:visible}.side .sec.grow{display:block}
#content{overflow:visible;display:block}#content .field.fill{display:block}#content .field.fill .qlist{max-height:none;overflow:visible}
}

/* ---- 반응형 (웹 배포용) ----
   데스크톱: 왼쪽 미리보기(화면 높이에 맞춤) + 오른쪽 설정 380px, 넓을수록 미리보기가 커짐
   태블릿(768~1024): 두 칸 유지, 설정 320px
   모바일(<768): 한 칸, 미리보기 가운데 */
.page{max-width:1440px;margin:0 auto;grid-template-columns:minmax(0,1fr) 380px!important;justify-content:stretch!important;align-items:start}
.preview{display:flex;flex-direction:column;align-items:center}
.preview>.toolbar,.preview>.exbar,.preview>.prog{width:100%;max-width:var(--sw)}
.stagebox{--sw:min(100%, calc((100vh - 420px) * .8));width:var(--sw)!important;min-width:260px!important;max-width:100%!important;margin:0 auto}
.preview{--sw:min(100%, max(300px, calc((100vh - 420px) * .8)), 720px)}
.preview .stagebox{width:var(--sw)!important}
.side{overflow:auto!important;scrollbar-width:thin}
.exbar{grid-template-columns:1fr 1fr!important}.exbar .sel{grid-column:1/-1}
.side .sec.grow{min-height:0}
@media(max-width:1024px){
  .page{grid-template-columns:minmax(0,1fr) 320px!important;padding:16px;gap:12px}
  .side{position:static}
}
@media(max-width:767px){
  .page{grid-template-columns:minmax(0,1fr)!important}
  .preview{--sw:min(100%, 520px)}
  .side{height:auto!important;max-height:none!important;overflow:visible!important}
  .side .sec.grow{display:block}
  #content{overflow:visible;display:block}#content .field.fill{display:block}#content .field.fill .qlist{max-height:none;overflow:visible}
}

/* 직무 칩 바로 아래에 선택한 직무의 값이 이어짐 (구분선·패널 없이) */
.sec.grow .sep-h{display:none}
.sec.grow .hrow2{margin:18px 0 0}
.sec.grow .hrow2:has(#cTitle:empty){display:none}
#content{margin-top:16px}
.sec.grow .hrow{margin:-6px 0 10px}
#jobs{gap:6px;align-items:center}#jobs .tg{padding:0 10px}
#jobs .jobadd{width:36px!important;height:36px!important;padding:0!important;display:inline-grid!important;place-items:center;border-radius:8px;vertical-align:top}
#jobs .jobadd .i{display:block;width:16px;height:16px}
#jobs .cw{display:inline-flex}
#fPose{background-color:#fff;border:1px solid hsl(var(--input));font:400 15px Pretendard,sans-serif;color:#171719;padding-left:14px}#fPose:focus{outline:0;border-color:hsl(var(--primary))}
.qlist{align-content:start}.qrow{align-content:start}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    ob.observe(b, {childList:true, characterData:true, subtree:true}); b.click(); grabModal(); return;

  if (tab === 2) {   // 원본 MP4 내보내기 (프레임 단위 · 끊김 없는 루프)
    const d = doc(2), m = d.getElementById('expMsg'); applyJob(2, false);
    d.getElementById('qn').value = String(Math.max(1, Math.min(6, win(2).__ep3.QS.length)));
    d.getElementById('res').value = scaleV() === 2 ? '2' : '1'; d.getElementById('qn').dispatchEvent(new Event('input'));
    lock(true, '준비 중'); prog(0);
    const ob = new MutationObserver(() => { const t = m.textContent, p = t.match(/(\d+)%/); if (p) { prog(+p[1] / 100); $('vid').querySelector('span').textContent = `녹화 ${p[1]}%`; }
      if (/완료|저장|실패|취소|없어요|못 찾은/.test(t)) { ob.disconnect(); prog(null); lock(false); if (!/완료|저장했어요/.test(t)) toast(t); } });
    ob.observe(m, {childList: true, characterData: true, subtree: true});
    ensureFontSub().catch(() => {}).then(() => d.getElementById('bExp').click()); return;
  }
  if (tab === 0) {   // 1편: 원본의 프레임 단위 루프 내보내기 (직무 3개 한 바퀴, 끝과 시작이 이어짐)
    const W = win(0).__fd, d = doc(0); for (const j of jobs.slice(0, 3)) card1(j); W.renderCards();
    d.getElementById('xres').value = String(1080 * scaleV()); d.getElementById('xcyc').value = '1'; d.getElementById('xfmt').value = 'mp4'; d.getElementById('xfmt').dispatchEvent(new Event('change'));
    const m = d.getElementById('xmsg'); lock(true, '준비 중'); prog(0);
    const ob = new MutationObserver(() => { const t = m.textContent, q = t.match(/(\d+)%/); if (q) { const v = /인코딩/.test(t) ? 0.5 + q[1]/200 : q[1]/200; prog(v); $('vid').querySelector('span').textContent = `영상 ${Math.round(v*100)}%`; }
      if (/완료|저장|못했|못 만들|만들지/.test(t)) { ob.disconnect(); prog(null); lock(false); if (!/완료|저장했어요/.test(t)) toast(t); card1(job()); W.renderCards(); } });
    ob.observe(m, {childList: true, characterData: true, subtree: true}); d.getElementById('xrec').click(); return;
  }
  const types = ['video/mp4;codecs=avc1.640033', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'], type = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { toast('이 브라우저는 영상 저장을 지원하지 않아요. 최신 Chrome에서 열어 주세요.'); return; }
  const cycles = cyc() ? jobs.length : 1;
  let src, dur, frameFn = null;
  if (tab === 0) { const W = win(0).__fd, p = W.o(); dur = (p.morph + p.hold) / 1000 * cycles / (win(0).__SPD || 1); src = W.cv;   // 1편은 재생 속도(60%)만큼 실제 시간이 짧음 → 직무 3개 한 바퀴만
    sel = 0; persist(); renderJobs(); renderContent(); applyJob(0, true); W.setPlaying(true); }

  playing = true; setPlaying(true);
  if (frameFn) frameFn();
  const chunks = [], rec = new MediaRecorder(src.captureStream(30), {mimeType: type, videoBitsPerSecond: 12e6});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  lock(true, '녹화 중'); rec.start();
  const t0 = performance.now(); let raf;
  const loop = () => { if (frameFn) frameFn(); const p = (performance.now() - t0) / 1000 / dur; prog(Math.min(1, p)); $('vid').querySelector('span').textContent = `녹화 중 ${Math.round(Math.min(1, p) * 100)}%`;
    if (p >= 1) { rec.stop(); return; } raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  rec.onstop = () => { prog(null); lock(false); save(new Blob(chunks, {type: type.split(';')[0]}), fname(type.includes('mp4') ? 'mp4' : 'webm'), 'vid'); };
});

/* ---------- AI 추천 (키워드 · 질문) ---------- */
let ai = null; try { window.claude?.use?.('sample').then(f => { ai = f; renderContent(); }).catch(() => {}); } catch(e){}
async function aiFill(k, what){   // what: 'kw' | 'qs' | 'all'
  const j = jobs[k]; if (!ai || !j) return false;
  const nq = Math.min(Math.max(j.qs ? j.qs.length : 0, 3), 10);   // 질문 칸 수만큼 (최소 3, 최대 10)
  const want = what === 'all' ? 'kw, tag, qs, sub' : what === 'kw' ? 'kw' : 'tag, qs';
  const prompt = `원티드(채용 플랫폼) 캠페인 '합격은 확률이다' 콘텐츠용 데이터를 만들어 줘. 직무: "${j.name}".
JSON 객체 하나로만 답해. 필요한 키: ${want}.
- kw: 이 직무 채용 공고·합격 이력서에 자주 나오는 핵심 키워드 10개 (문자열 배열, 각 2~12자, 툴·스킬·역량을 섞고 한국 채용 시장 표기 그대로. 예: "Figma", "A/B 테스트")
- tag: 원 안에 들어갈 포지션 약어 2~3자 대문자 영문 (예: UX, FE, DA, PM)
- qs: 이 직무 면접관이 실제로 물을 법한 질문 정확히 ${nq}개 (서로 다른 키워드로). 각 {"kw": 이력서 키워드 2~8자, "q": 질문}. q는 존댓말 한 문장을 의미 단위로 두 줄로 나눠 "\n"으로 구분, 각 줄 20자 이내, 물음표로 끝.
- sub: 카드 둘째 줄 "원티드랩 · 경력 N년 이상" 형식 (N은 이 직무에 흔한 값)
예: {"kw":["SQL","Python"],"tag":"DA","qs":[{"kw":"리텐션 분석","q":"리텐션 코호트를 어떻게 나눴고,\n그 결과 무엇이 바뀌었나요?"}],"sub":"원티드랩 · 경력 3년 이상"}`;
  const r = await ai.json(prompt, {cache: false});
  if (Array.isArray(r?.kw) && what !== 'qs') j.kw = r.kw.map(String).map(x => x.trim()).filter(Boolean).slice(0, 14);
  if (r?.tag && what !== 'kw') j.tag = String(r.tag).slice(0, 4);
  if (Array.isArray(r?.qs) && what !== 'kw') j.qs = r.qs.filter(x => x && x.q).map(x => ({kw: String(x.kw || '').slice(0, 12), q: String(x.q).replace(/\\n/g, '\n')}))
    .slice(0, nq);
  if (r?.sub && what === 'all') j.sub = String(r.sub).slice(0, 30);
  persist(); return true;
}
async function runAI(k, what){
  const b = $('aiBtn'); b.disabled = true; b.querySelector('span').textContent = '추천 중…';
  try { if (await aiFill(k, what)) { if (k === sel) { renderContent(); applyJob(tab, true); } toast('AI가 채웠어요. 필요하면 고쳐 쓰세요.'); } }
  catch(e) { if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') { ai = null; } else if (e?.code !== 'cancelled') toast('AI 추천을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.'); }
  finally { b.disabled = false; b.querySelector('span').textContent = 'AI 추천'; renderContent(); }
}
$('aiBtn').addEventListener('click', () => { if (!ai) { toast('AI 추천은 Claude 환경에서만 동작해요. Claude에서 이 툴을 열면 사용할 수 있어요.'); return; } runAI(sel, tab === 1 ? 'kw' : 'qs'); });
/* 오른쪽 패널 높이 = 미리보기 카드 높이 (단계마다 스크롤 길이 같게) */
const pv = document.querySelector('.preview'), sd = document.querySelector('.side');
new ResizeObserver(() => { sd.style.height = innerWidth > 767 ? pv.offsetHeight + 'px' : ''; }).observe(pv);
/* ---------- 시작 ---------- */
document.querySelectorAll('.trig').forEach(b => b.setAttribute('aria-selected', +b.dataset.i === tab));
renderJobs(); setTab(tab);
const hk = setInterval(() => { if (READY[0]) { hook1(); clearInterval(hk); } }, 300);
}
</script>
